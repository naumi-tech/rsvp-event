<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aqeeqah RSVPs</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e9;
    --card: #fffdf9;
    --ink: #2f3a33;
    --muted: #6b7569;
    --accent: #5f7d68;
    --gold: #b8955a;
    --line: #e4dccd;
    --error: #a3423a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 32px 16px 48px;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-family: "Cormorant Garamond", serif; font-size: 36px; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; max-width: 420px; }
  input {
    flex: 1; min-width: 0;
    font: inherit; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  button {
    font: inherit; font-weight: 600;
    background: var(--accent); color: #fff;
    border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .error { color: var(--error); margin: 10px 0 0; }
  .hidden { display: none !important; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; font-weight: 600; color: var(--gold); }
  .stat .value { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 12px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  .no { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 24px; }
</style>
</head>
<body>
<main>
  <h1>Aqeeqah RSVPs</h1>

  <section class="card" id="login">
    <form id="login-form">
      <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required>
      <button type="submit">View</button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </section>

  <section id="list" class="hidden">
    <div class="stats">
      <div class="card stat"><div class="label">Attending</div><div class="value" id="s-yes">0</div></div>
      <div class="card stat"><div class="label">Adults</div><div class="value" id="s-adults">0</div></div>
      <div class="card stat"><div class="label">Children</div><div class="value" id="s-children">0</div></div>
      <div class="card stat"><div class="label">Total guests</div><div class="value" id="s-total">0</div></div>
      <div class="card stat"><div class="label">Declined</div><div class="value" id="s-no">0</div></div>
    </div>
    <div class="toolbar">
      <button class="ghost" id="refresh">Refresh</button>
      <button id="csv">Download CSV</button>
    </div>
    <div class="card table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Attending</th><th>Adults</th><th>Children</th><th>Phone</th><th>Message</th><th>Received</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  var password = "";
  var rsvps = [];

  try { password = sessionStorage.getItem("rsvp-admin") || ""; } catch (e) {}
  if (password) load();

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    password = document.getElementById("password").value;
    load();
  });
  document.getElementById("refresh").addEventListener("click", load);
  document.getElementById("csv").addEventListener("click", downloadCsv);

  function load() {
    document.getElementById("error").textContent = "";
    fetch("/api/rsvps", { headers: { Authorization: "Bearer " + password } })
      .then(function (res) {
        return res.json().then(function (body) {
          if (!res.ok) throw new Error(body.error || "Could not load RSVPs");
          return body;
        });
      })
      .then(function (body) {
        try { sessionStorage.setItem("rsvp-admin", password); } catch (e) {}
        rsvps = body.rsvps;
        render();
        document.getElementById("login").classList.add("hidden");
        document.getElementById("list").classList.remove("hidden");
      })
      .catch(function (err) {
        try { sessionStorage.removeItem("rsvp-admin"); } catch (e) {}
        document.getElementById("login").classList.remove("hidden");
        document.getElementById("list").classList.add("hidden");
        document.getElementById("error").textContent = err.message;
      });
  }

  function render() {
    var yes = rsvps.filter(function (r) { return r.attending === "Yes"; });
    var adults = yes.reduce(function (n, r) { return n + r.adults; }, 0);
    var children = yes.reduce(function (n, r) { return n + r.children; }, 0);
    set("s-yes", yes.length);
    set("s-adults", adults);
    set("s-children", children);
    set("s-total", adults + children);
    set("s-no", rsvps.length - yes.length);

    var tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    if (!rsvps.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">No RSVPs yet.</td></tr>';
      return;
    }
    rsvps.slice().reverse().forEach(function (r) {
      var tr = document.createElement("tr");
      if (r.attending === "No") tr.className = "no";
      [r.name, r.attending, r.adults, r.children, r.phone, r.message, new Date(r.at).toLocaleString()]
        .forEach(function (v, i) {
          var td = document.createElement("td");
          if (i === 2 || i === 3) td.className = "num";
          td.textContent = v;
          tr.appendChild(td);
        });
      tbody.appendChild(tr);
    });
  }

  function set(id, v) { document.getElementById(id).textContent = v; }

  function downloadCsv() {
    var cols = ["name", "attending", "adults", "children", "phone", "message", "at"];
    var lines = [cols.join(",")].concat(rsvps.map(function (r) {
      return cols.map(function (c) { return '"' + String(r[c] == null ? "" : r[c]).replace(/"/g, '""') + '"'; }).join(",");
    }));
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = "aqeeqah-rsvps.csv";
    a.click();
  }
</script>
</body>
</html>
