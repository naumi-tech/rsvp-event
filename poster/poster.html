<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e9;--card:#fffdf9;--ink:#2f3a33;--muted:#6b7569;--accent:#5f7d68;--gold:#b8955a;--line:#e4dccd}
*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;height:1350px;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);padding:48px}
.frame{height:100%;border:2px solid var(--gold);border-radius:28px;padding:10px}
.inner{height:100%;border:1px solid var(--line);border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 72px 56px}
.bis{font-family:Amiri,serif;font-size:42px;color:var(--gold);margin:0;direction:rtl}
.kicker{margin:34px 0 0;text-transform:uppercase;letter-spacing:.22em;font-size:20px;font-weight:600;color:var(--muted)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:118px;line-height:.98;margin:18px 0 0}
.lead{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:32px;color:var(--muted);margin:22px 0 0}
.div{width:120px;height:1px;background:var(--gold);margin:40px auto;position:relative}
.div:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;background:var(--card);border:1px solid var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.details{display:flex;gap:56px;justify-content:center}
.d dt{text-transform:uppercase;letter-spacing:.16em;font-size:16px;font-weight:600;color:var(--gold)}
.d dd{margin:8px 0 0;font-size:28px;font-weight:500;line-height:1.3}
.rsvp{margin-top:auto;display:flex;align-items:center;gap:36px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:28px 36px;text-align:left}
.qr{width:200px;height:200px;background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}
.rsvp h2{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:600;margin:0}
.rsvp p{margin:6px 0 0;font-size:22px;color:var(--muted)}
.rsvp .url{margin-top:14px;font-size:26px;font-weight:600;color:var(--accent);word-break:break-all}
</style></head><body><div class="frame"><div class="inner">
